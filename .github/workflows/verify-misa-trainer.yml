name: Verify MISA Trainer integration (CPU)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-misa-trainer.yml'
      - 'dongkyu_work/misa/scripts/verify_trainer.py'
      - 'dongkyu_work/misa/implementation/**'
      - 'methods/_trainer.py'
      - 'methods/dualprompt.py'
      - 'utils/onlinesampler.py'
      - 'datasets/OnlineIterDataset.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Shared DataLoader to Adam update, MISA batch mask and task boundary
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install torch and torchvision CPU
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchvision==0.20.1
      - name: Install FlyGCL source import dependencies
        run: python -m pip install timm==0.6.12 numpy==1.26.4 scipy==1.13.1 scikit-learn==1.6.0 pandas==2.2.3 matplotlib==3.9.4 opencv-python-headless==4.10.0.84 wandb==0.20.1
      - name: Execute MISA Trainer integration on CPU synthetic data only
        run: python dongkyu_work/misa/scripts/verify_trainer.py
