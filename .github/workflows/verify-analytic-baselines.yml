name: Verify AIR GACL SLDA integration (CPU)
on:
  push:
    branches: [main]
    paths:
      - 'dongkyu_work/air/**'
      - 'dongkyu_work/gacl/**'
      - 'dongkyu_work/slda/**'
      - 'dongkyu_work/analytic_common/**'
      - 'models/**'
      - 'methods/**'
      - 'configuration/**'
      - 'utils/**'
      - 'datasets/**'
      - 'main.py'
      - '.github/workflows/verify-analytic-baselines.yml'
  pull_request:
    paths:
      - 'dongkyu_work/air/**'
      - 'dongkyu_work/analytic_common/**'
      - 'models/**'
      - 'methods/**'
      - 'configuration/**'
      - '.github/workflows/verify-analytic-baselines.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchvision==0.20.1
      - name: Install project imports
        run: python -m pip install timm==0.6.12 numpy==1.26.4 scipy==1.13.1 scikit-learn==1.6.1 pandas==2.2.3 matplotlib==3.9.4 opencv-python-headless==4.10.0.84 wandb==0.20.1
      - name: Verify original cores and checkpoint continuation
        run: python -m dongkyu_work.analytic_common.tests.verify_heads
      - name: Verify real main.py shared stream and evaluation
        run: python -m dongkyu_work.analytic_common.tests.verify_integration
      - name: Validate launchers and documentation
        run: |
          for method in air gacl slda; do bash -n "dongkyu_work/$method/scripts/run_$method.sh"; done
          python dongkyu_work/misa/scripts/verify_docs.py
