name: Verify SinglePrompt Stage 2 CPU model parity
on:
  push:
    branches: [feature/singleprompt-stage2]
    paths:
      - '.github/workflows/verify-singleprompt-stage2.yml'
      - 'dongkyu_work/singleprompt/implementation/**'
      - 'dongkyu_work/singleprompt/scripts/verify_model.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU Torch matching FlyGCL
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchvision==0.20.1
      - name: Install FlyGCL import dependencies
        run: python -m pip install timm==0.6.12 numpy==1.26.4 scipy==1.13.1 scikit-learn==1.6.0 pandas==2.2.3 matplotlib==3.9.4 opencv-python-headless==4.10.0.84 wandb==0.20.1
      - name: Check model syntax and upstream-output parity
        run: |
          python -m py_compile dongkyu_work/singleprompt/implementation/model.py dongkyu_work/singleprompt/scripts/verify_model.py
          PYTHONPATH=. python -m dongkyu_work.singleprompt.scripts.verify_model
